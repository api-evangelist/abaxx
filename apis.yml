aid: abaxx
name: Abaxx
description: >-
  Abaxx Technologies is a financial software and market infrastructure company
  whose principal operating business, Abaxx Exchange, is a centrally-cleared
  commodity futures and derivatives exchange headquartered in Singapore and
  focused on energy-transition commodities across four markets: Energy (LNG),
  Environmental (carbon credits), Battery Materials (nickel, lithium), and
  Precious Metals. Abaxx Clearing (Abaxx Singapore Clearing Corporation)
  centrally clears the contracts, and the group also develops SMX (smart
  data / consensus-formation) technology. Trading runs on the markets.abaxx.exchange
  platform; market data is distributed to third parties including TradingView
  (ABAXX: symbol prefix), ipushpull (Microsoft Excel add-in) and LSEG/Refinitiv.
  Abaxx Technologies is publicly listed (Cboe Canada: ABXX; OTCQX: ABXXF). Abaxx
  does not currently publish a public developer portal, OpenAPI/FIX specification,
  SDKs or an MCP server; connectivity is arranged through member/broker
  onboarding. This profile originated as an earlybird portfolio lead in the API
  Evangelist network and has been enriched with verified public identity and
  security-posture signals.
